name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    # dev is the persistent integration branch, so PRs land there first.
    branches: [main, dev]

env:
  # The VSL conformance kit (tests/conformance/ in sdcreceipt) and sdcgovernance's RFC 8785 vectors
  # (test-vectors/). Pinned so the reference is fixed; moving either is a deliberate change, made
  # with the CHANGELOG and README. Kit 1.3 (27 vectors, 5 key-document cases, 10 condition cases) is
  # sdcreceipt's dev commit dbf142b (PR #35, after 4.5.0); sdcgovernance's decision-table and governance-Receipt vectors are
  # pinned by commit.
  KIT_REF: dbf142b3fd351109c64c3f53e0f1327583e5f358
  VECTORS_REF: 396c2bf32755789b563c5cac08da0fde564ae995

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22", "24"]

    steps:
      - uses: actions/checkout@v7

      - name: Check out the conformance kit
        uses: actions/checkout@v7
        with:
          repository: SemanticDataCharter/sdcreceipt
          ref: ${{ env.KIT_REF }}
          path: sdcreceipt
          sparse-checkout: tests/conformance

      - name: Check out the canonicalization vectors
        uses: actions/checkout@v7
        with:
          repository: SemanticDataCharter/sdcgovernance
          ref: ${{ env.VECTORS_REF }}
          path: sdcgovernance
          sparse-checkout: test-vectors

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Conformance kit, canonicalization and governance vectors, party side, settle, MCP server
        run: npm test
        env:
          SDCRECEIPT_KIT: ${{ github.workspace }}/sdcreceipt/tests/conformance
          JCS_VECTORS: ${{ github.workspace }}/sdcgovernance/test-vectors/rfc8785-canonicalization.json
          GOVERNANCE_VECTORS: ${{ github.workspace }}/sdcgovernance/test-vectors

      - name: Build
        run: npm run build
